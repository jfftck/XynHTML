name: Publish xyn-signal to NPM

on:
  push:
    tags:
      - 'xyn-signal-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/xyn-signal-v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Update package version
        working-directory: packages/xyn-signal
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build package
        working-directory: packages/xyn-signal
        run: npm run build

      - name: Publish to NPM
        working-directory: packages/xyn-signal
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: xyn-signal v${{ steps.version.outputs.version }}
          tag_name: xyn-signal-v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            packages/xyn-signal/dist/xyn_signal.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
